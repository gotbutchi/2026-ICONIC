version: 2

models:
  - name: fct_weekly_sales
    description: "Weekly sales transactions per store"
    columns:
      - name: sales_sk
        description: "Primary key (hash of store_id + partition_date)"
        tests:
          - unique
          - not_null
      - name: store_id
        description: "FK to dim_store"
        tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: partition_date
        description: "FK to dim_date"
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: is_holiday_week
        description: "Whether the week contains a holiday"
        tests:
          - not_null

  - name: dim_store
    description: "Store dimension with SCD Type 2 for economic indicators"
    columns:
      - name: store_sk
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: store_id
        description: "Natural key (not unique — SCD2 can have multiple rows per store)"
        tests:
          - not_null

  - name: dim_date
    description: "Date spine from 2000 to 2030"
    columns:
      - name: date_id
        description: "Date primary key"
        tests:
          - unique
          - not_null
      - name: is_holiday
        description: "Flag if the date is a holiday"
        tests:
          - not_null

  - name: agg_monthly_sales
    description: "Monthly sales rollup with HLL sketch for distinct store counts"

  - name: mart_comeback_king
    description: "Top 10 store-months with the largest sales turnaround"

  - name: mart_anomaly_detection
    description: "Weeks with sales deviating more than 3 standard deviations"

  - name: mart_counter_cyclical
    description: "Stores ranked by average sales during high-unemployment periods"
